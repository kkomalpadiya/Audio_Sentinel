[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-sentinel"
version = "0.1.0"
description = "Multi-agent audio threat detection prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "soundfile>=0.12,<1",
  "librosa>=0.10,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]
ml = [
  "torch>=2.3,<3",
  "onnxruntime>=1.19,<2",
  "faster-whisper>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

